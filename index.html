<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Pokémon Explorer</h1>
        <p>Discover Pokémon, their abilities, and stats.</p>
    </header>

<main>
    <section aria-labelledby="search-heading">
        <h2 id="search-heading">Find a Pokémon</h2>

        <form id="pokemon-form">
            <label for="pokemon-search">Pokémon Name or ID</label>

            <input
                type="text"
                id="pokemon-search"
                placeholder="e.g. Pikachu"
                required
            >

            <button type="submit">Search</button>
            <button type="button" id="random-button">
                Random Pokémon
            </button>
        </form>
    </section>
    <section aria-labelledby="results-heading">
    <h2 id="results-heading">Pokémon Information</h2>

    <p id="status-message" role="status">
        Search for a Pokémon to get started.
    </p>

    <div id="pokemon-result"></div>
</section>
</main>

    <footer>
        <p>Data provided by PokéAPI.</p>
    </footer>
</body>
</html>
